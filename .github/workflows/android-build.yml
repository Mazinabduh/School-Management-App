name: بناء تطبيق ادارة المدرسة (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK موقّع
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: قبول تراخيص SDK مسبقاً
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: تثبيت Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: مزامنة نسخة الويب داخل الأندرويد (مصدر الحقيقة web-app)
        run: |
          rsync -a --delete --exclude README.md web-app/ android-app/app/src/main/assets/www/
          echo "www synced: $(find android-app/app/src/main/assets/www -type f | wc -l) ملفاً"

      - name: بناء نسخة Release موقّعة
        run: gradle -p android-app assembleRelease --no-daemon

      - name: إعادة تسمية APK
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/release/app-release.apk output/school-management-v3.5.apk
          ls -la output/

      - name: رفع APK كمُخرج البناء
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: school-apk-${{ github.run_number }}
          path: output/school-management-v3.5.apk
          if-no-files-found: error

      - name: إنشاء إصدار مع APK (كل دفعة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5-build-${{ github.run_number }}
          name: تطبيق ادارة المدرسة v3.5 — بناء ${{ github.run_number }}
          body: |
            **تطبيق ادارة المدرسة v3.5** (versionCode 5) — توأم المحطة v2026.100 — إصلاح جذري للنسخ الاحتياطي والطباعة وPDF

            ما الجديد في v3.5:
            - 🏰 **النسخ الاحتياطي — إصلاح جذري**: الحصن المحلي بنظام المحطة v2026.100 بالنص — مرآة SQLite داخل الأندرويد (edupro_vault_v1) + نسخ تلقائية خارجية في Download/Edupro/data/backups (حتى 30 نسخة) + استعادة الإقلاع تلقائياً إذا فُقدت البيانات — بدون أي قائمة اختيار مجلد
            - 🐙 استعادة GitHub تعمل الآن بقنوات موثوقة مرتبة (raw ثم Base64 ثم download_url) مع قبول مرن للصيغ وحفظ التوكن — الرفع والاستعادة على أي جهاز
            - 🚀 **اسم المدرسة وشعارها يظهران عند فتح التطبيق** مثل المحطة بالضبط: الإقلاع الأصلي يقرأ الاسم والشعار المحفوظين + شاشة الويب تُحدَّث فوراً بعد أي تغيير (نظام boot-login بالنص)
            - 📄 **PDF بنظام المحطة v2026.100 بالنص**: عربي سليم غير مقلوب (حاوية RTL + خطوط Cairo ثابتة Regular/Bold) + ترتيب صفحات ذكي يقص عند الفراغات + شريط تذييل باسم المدرسة ورقم الصفحة (صفحة X من Y) + دعم النسخ المتعددة + حفظ في Download/Edupro Document وفتح تلقائي
            - 🧾 **مستيل الطباعة المؤسسي في كل التقارير والطباعات**: المستطيل العلوي (الشعار + اسم المدرسة + بياناتها + التاريخ) بنظام pp-* من المحطة — شمل ملف الطالب والطباعة التجريبية وسند القبض وكشف الحساب والمسيرات
            - 🛠️ إصلاح انقلاب/انكسار نصوص رؤوس الجداول في PDF والطباعة (تحويل تلقائي th → td.pp-th بضمانة التصيير)
            - 🎨 الشفافية تعمل فوراً: ألوان الوضع الحالي تُورَّث تلقائياً — منزلق درجة الشفافية والضبابية يؤثران لحظياً على كل القوائم
            - 🧭 الشريط السفلي: 6 تبويبات مباشرة بدون زر «المزيد» — مثل المحطة v2026.100 بالضبط
            - 📋 تذييل القائمة الجانبية: رقم الإصدار فقط — بدون مربع المطور (مثل المحطة)
            - 💾 مجلدات حفظ مستقلة تماماً: Edupro Document / Edupro Backup — لا تختلط مع أي تطبيق آخر

            مزايا الإصدارات السابقة (v1.1):
            - الطباعة والحفظ (PDF/xlsx/Word) بنظام تطبيق المحطة حرفياً — يُحفظ في التنزيلات ويعمل دون إنترنت
            - قائمة الطلاب بنمط قائمة المشتركين: 50 طالباً ثم زر «المزيد»
            - شاشة دخول native + تذكرني + جميع الحقوق محفوظة لشركة YCMS

            التثبيت: حمّل APK وثبّته — الحساب الافتراضي admin / admin123 (غيّره بعد أول دخول)
            بعد أول دخول: استخدم زر «توليد البيانات التجريبية» من صفحة النسخ الاحتياطي لتجربة كل الميزات، ثم «حذف البيانات التجريبية» واستعد نسختك الحقيقية.

            جميع الحقوق محفوظة لشركة YCMS — برمجة وتطوير: مازن عبدالوهاب 774047989 — إدارة محاسبية: صدام نجم الدين
          files: output/school-management-v3.5.apk
