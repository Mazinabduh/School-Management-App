name: بناء تطبيق ادارة المدرسة (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK موقّع
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: قبول تراخيص SDK مسبقاً
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: تثبيت Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: مزامنة نسخة الويب داخل الأندرويد (مصدر الحقيقة web-app)
        run: |
          rsync -a --delete --exclude README.md web-app/ android-app/app/src/main/assets/www/
          echo "www synced: $(find android-app/app/src/main/assets/www -type f | wc -l) ملفاً"

      - name: بناء نسخة Release موقّعة
        run: gradle -p android-app assembleRelease --no-daemon

      - name: إعادة تسمية APK
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/release/app-release.apk output/school-management-v3.6.apk
          ls -la output/

      - name: رفع APK كمُخرج البناء
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: school-apk-${{ github.run_number }}
          path: output/school-management-v3.6.apk
          if-no-files-found: error

      - name: إنشاء إصدار مع APK (كل دفعة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6-build-${{ github.run_number }}
          name: تطبيق ادارة المدرسة v3.6 — بناء ${{ github.run_number }}
          body: |
            **تطبيق ادارة المدرسة v3.6** (versionCode 6) — توأم المحطة v2026.100 — المستطيل العلوي مُصغَّر + ألوانه من الإعدادات + قائمة اختيار مجلد النسخة الاحتياطية + إصلاح اسم المدرسة عند الإقلاع

            ما الجديد في v3.6:
            - 🏫 **اسم المدرسة وشعارها يظهران في صفحة الاستقبال عند فتح التطبيق** — إصلاح جذري: كانت مرآة الهوية تُكتب في ملف جلسات آخر فلا يقرأها الإقلاع الأصلي أبداً — الآن تُكتب في edupro_brand مباشرة (SplashActivity يعرض الاسم والشعار المحفوظين)، وسطر التعريف في شاشة الدخول أصبح باسم المدرسة بدل النص الثابت
            - 📐 **المستطيل العلوي في كل التقارير والطباعة مُصغَّر ومناسب**: حشوات أقل + شعار 40px + عنوان 13pt + بيانات 8pt — وملف الطالب تحديداً: العنوان سطر واحد واسم الطالب سطر فرعي (من 82px إلى 68px)
            - 🎨 **لون المستطيل العلوي ورؤوس الجداول يتبع الإعدادات**: ثيمات المستندات (أزرق ملكي/زمردي/ذهبي/بنفسجي) تصبغ الترويسة ورؤوس الجداول والصفوف والتذييل في الطباعة وPDF معاً — مع إصلاح عطلين: حفظ الألوان كان يثبّت لوناً ثابتاً، وقاعدة واجهة عامة كانت تقتل لون رؤوس الجداول داخل إطار الطباعة
            - 📂 **قائمة اختيار مجلد النسخ الاحتياطية داخل قائمة النسخة الاحتياطية**: زر «اختيار مجلد النسخ الاحتياطية» يفتح منتقي مجلدات الأندرويد — النسخ تُحفظ وتُقرأ وتُستعاد من المجلد المختار، وزر «المجلد الافتراضي» يعيد Download/Edupro/data/backups
            - 📦 مزامنة كاملة لنسخة الويب داخل مجلد www في المشروع (144 ملفاً بأحدث الوحدات)
            - 🏰 استمرار الحصن المحلي: مرآة SQLite (edupro_vault_v1) + استعادة الإقلاع — تعمل مع المجلد المختار أيضاً

            ما الجديد في v3.5:
            - 🏰 الحصن المحلي بنظام المحطة v2026.100 بالنص — مرآة SQLite داخل الأندرويد + نسخ تلقائية خارجية (حتى 30 نسخة) + استعادة الإقلاع تلقائياً إذا فُقدت البيانات
            - 🐙 استعادة GitHub بقنوات موثوقة مرتبة (raw ثم Base64 ثم download_url) — الرفع والاستعادة على أي جهاز
            - 🚀 اسم المدرسة وشعارها يظهران عند فتح التطبيق مثل المحطة بالضبط + تحديث فوري بعد أي تغيير
            - 📄 PDF بنظام المحطة v2026.100 بالنص: عربي سليم غير مقلوب + ترتيب صفحات ذكي + شريط تذييل باسم المدرسة ورقم الصفحة
            - 🧾 مستيل الطباعة المؤسسي في كل التقارير (بنظام pp-* من المحطة) + إصلاح انقلاب نصوص رؤوس الجداول
            - 🎨 الشفافية فورية + الشريط السفلي 6 تبويبات بلا «المزيد» + تذييل الجانبية برقم الإصدار فقط + مجلدات Edupro مستقلة

            مزايا الإصدارات السابقة (v1.1):
            - الطباعة والحفظ (PDF/xlsx/Word) بنظام تطبيق المحطة حرفياً — يُحفظ في التنزيلات ويعمل دون إنترنت
            - قائمة الطلاب بنمط قائمة المشتركين: 50 طالباً ثم زر «المزيد»
            - شاشة دخول native + تذكرني + جميع الحقوق محفوظة لشركة YCMS

            التثبيت: حمّل APK وثبّته — الحساب الافتراضي admin / admin123 (غيّره بعد أول دخول)
            بعد أول دخول: استخدم زر «توليد البيانات التجريبية» من صفحة النسخ الاحتياطي لتجربة كل الميزات، ثم «حذف البيانات التجريبية» واستعد نسختك الحقيقية.

            جميع الحقوق محفوظة لشركة YCMS — برمجة وتطوير: مازن عبدالوهاب 774047989 — إدارة محاسبية: صدام نجم الدين
          files: output/school-management-v3.6.apk
