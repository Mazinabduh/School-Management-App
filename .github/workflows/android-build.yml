name: بناء تطبيق ادارة المدرسة (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK موقّع
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: قبول تراخيص SDK مسبقاً
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: تثبيت Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: بناء نسخة Release موقّعة
        run: gradle -p android-app assembleRelease --no-daemon

      - name: إعادة تسمية APK
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/release/app-release.apk output/school-management-v1.1.apk
          ls -la output/

      - name: رفع APK كمُخرج البناء
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: school-apk-${{ github.run_number }}
          path: output/school-management-v1.1.apk
          if-no-files-found: error

      - name: إنشاء إصدار مع APK (كل دفعة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-build-${{ github.run_number }}
          name: تطبيق ادارة المدرسة v1.1 — بناء ${{ github.run_number }}
          body: |
            **تطبيق ادارة المدرسة v1.1** (versionCode 2) — إصلاح الطباعة والحفظ بنفس نظام تطبيق المحطة حرفياً

            ما الجديد في v1.1:
            - الطباعة تعمل الآن على أندرويد: محتوى الطباعة يُعرض في منطقة printZone داخل التطبيق ويُطبع عبر نظام أندرويد (PrintManager) — الورقة تخرج بجدول الطباعة وحده بلا أيقونات البرنامج العلوية/السفلية وبلا صفحات بيضاء (نفس تطبيق المحطة حرفياً)
            - عمودي/أفقي يُمرَّران لنظام الطباعة + إعدادات الورقة والهوامش والخط تُطبَّق على الورقة
            - الحفظ يعمل الآن على أندرويد: كل التنزيلات (نسخة JSON، Excel xlsx، Word doc، CSV) تُحفظ في مجلد التنزيلات أو عبر مربع اختيار المكان — اعتراض كامل لتنزيلات blob داخل التطبيق (نفس تطبيق المحطة)
            - PDF يُحفظ في التنزيلات ويُفتح مباشرة في العارض بعد الحفظ
            - الاستعادة عبر منتقي ملفات أندرويد + إدخال الملف تلقائياً في شاشة الاستعادة
            - عدد النسخ يُضبط من نافذة طباعة النظام نفسها (كما في المحطة)
            - وضع المتصفح (نسخة الويب) يعمل كما هو عبر إطار معزول

            مزايا v1.0:
            - شاشة إقلاع Native بشعار YCMS المتوهج + جميع الحقوق محفوظة لشركة YCMS
            - شاشة دخول native بنمط المحطة: خلفية Canvas متحركة + إظهار/إخفاء كلمة المرور + تذكرني (حفظ الجلسة مرة واحدة)
            - بطاقة حول البرنامج: جميع الحقوق محفوظة لشركة YCMS — برمجة وتطوير: مازن عبدالوهاب — 774047989
            - قائمة الطلاب بنمط قائمة المشتركين: 50 طالباً ثم زر «المزيد»
            - تطبيق فاضي — تستعيد بياناتك القديمة من النسخة الاحتياطية JSON/Excel
            - رصد الدرجات + النتائج والشهادات + الأقساط + الميزانية + الزي والكتب + الباصات + الموظفين والرواتب + استوديو البطاقات + مركز التقارير

            التثبيت: حمّل APK وثبّته — الحساب الافتراضي admin / admin123 (غيّره بعد أول دخول)

            جميع الحقوق محفوظة لشركة YCMS — برمجة وتطوير: مازن عبدالوهاب 774047989
          files: output/school-management-v1.1.apk
