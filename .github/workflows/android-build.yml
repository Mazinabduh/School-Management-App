name: بناء تطبيق ادارة المدرسة (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK موقّع
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: قبول تراخيص SDK مسبقاً
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: تثبيت Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: بناء نسخة Release موقّعة
        run: gradle -p android-app assembleRelease --no-daemon

      - name: إعادة تسمية APK
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/release/app-release.apk output/school-management-v1.2.apk
          ls -la output/

      - name: رفع APK كمُخرج البناء
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: school-apk-${{ github.run_number }}
          path: output/school-management-v1.2.apk
          if-no-files-found: error

      - name: إنشاء إصدار مع APK (كل دفعة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-build-${{ github.run_number }}
          name: تطبيق ادارة المدرسة v1.2 — بناء ${{ github.run_number }}
          body: |
            **تطبيق ادارة المدرسة v1.2** (versionCode 3) — تطبيق خالي من العيوب + واجهة بنمط المحطة

            ما الجديد في v1.2:
            - ✅ إصلاح تداخل الأيقونات السفلية مع المحتوى في كل الصفحات (كانت أيقونات الشريط السفلي تعلق فوق البيانات — الآن المحتوى لا يمر تحتها أبداً)
            - 🏆 شهادة تقدير وتميّز للطلاب: تصميم فاخر بإطار ذهبي + 6 أنواع (تفوق، انتظام، سلوك، أنشطة…) + شهادة مخصصة + طباعة/PDF/شهادة لكل الطلاب
            - 🧪 زر توليد بيانات تجريبية بضغطة واحدة: **500 طالب + 60 موظفاً + باصات + درجات لكل الطلاب + أقساط وتحصيل + زي وكتب + رواتب + تعميمات + حركات مالية** — وزر حذف البيانات التجريبية دون المساس ببياناتك الحقيقية
            - 🎨 واجهة بنمط المحطة بالكامل: شريط علوي زجاجي بأسطوانة أخبار متحركة + قائمة جانبية بأيقونات ثلاثية الأبعاد حقيقية + شريط سفلي مستدير + بطاقات إحصاء 3D + إجراءات سريعة — بطابع مدرسي
            - ✍️ إصلاح مشاكل كشف الدرجات: الحفظ لم يعد يخلط الدرجات بين المواد عند التبديل السريع، ومتوسط الصف يحسب للمرصد فقط
            - 🌙 الوضع الليلي بنمط المحطة افتراضي + إعدادات ثيمات حية (ألوان، خط، مقاسات)
            - 🖼️ شعار شركة YCMS أصبح أيقونة التطبيق في سطح المكتب وكل المواضع
            - ✨ مشهد إقلاع Native متطور بنمط المحطة بطابع مدرسي: سماء بنجوم وقمر، مبنى مدرسة يرتفع مع ساعة وعلم يرفرف، حروف وأرقام متوهجة، كتاب مفتوح، قبعة تخرج مع تألق ذهبي — مع التوقيعات
            - 📝 التوقيعات في بداية التطبيق وحول البرنامج: **برمجة وتطوير: مازن عبدالوهاب** وتحتها **إدارة محاسبية: صدام نجم الدين**

            مزايا الإصدارات السابقة (v1.1):
            - الطباعة والحفظ (PDF/xlsx/Word) بنظام تطبيق المحطة حرفياً — يُحفظ في التنزيلات ويعمل دون إنترنت
            - قائمة الطلاب بنمط قائمة المشتركين: 50 طالباً ثم زر «المزيد»
            - شاشة دخول native + تذكرني + جميع الحقوق محفوظة لشركة YCMS

            التثبيت: حمّل APK وثبّته — الحساب الافتراضي admin / admin123 (غيّره بعد أول دخول)
            بعد أول دخول: استخدم زر «توليد البيانات التجريبية» من صفحة النسخ الاحتياطي لتجربة كل الميزات، ثم «حذف البيانات التجريبية» واستعد نسختك الحقيقية.

            جميع الحقوق محفوظة لشركة YCMS — برمجة وتطوير: مازن عبدالوهاب 774047989 — إدارة محاسبية: صدام نجم الدين
          files: output/school-management-v1.2.apk
